name: update-profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate telemetry
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a PAT as PROFILE_TOKEN to include private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/generate.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets/
          git commit -m "chore: update telemetry"
          git push
